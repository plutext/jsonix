name: Publish @docx4j/jsonix to NPM

on:
  release:
    types: [published]

permissions:
  id-token: write # required for trusted publishing's use of OIDC
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Manually update npm to 11.5.1 or later which is the required version for trusted publishing to work # this step can be removed after the ubuntu runner has the correct minimum version of npm installed
        run: npm install -g npm@latest
      
      - name: Install Project Dependencies
        working-directory: ./nodejs/scripts
        run: npm ci

      - name: Refuse unless the release tag names package.json's version
        working-directory: ./nodejs/scripts
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "release tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi

      # Publishing a tarball skips prepublishOnly, so the checks are explicit.
      - name: Type-check and test
        working-directory: ./nodejs/scripts
        run: npm run typecheck && npm test && npm run test:esm && npm run test:bundle

      - name: Refuse if the checks left the working tree dirty
        run: git diff --quiet || { git status --short; exit 1; }

      - name: Remove Tests and Demos
        working-directory: ./nodejs/scripts
        run: |
          rm -rf tests
      
      - name: Package Items
        working-directory: ./nodejs/scripts
        run: npm pack
      
      - name: Publish to npm
        working-directory: ./nodejs/scripts
        run: npm publish --access public docx4j-jsonix-*.tgz
